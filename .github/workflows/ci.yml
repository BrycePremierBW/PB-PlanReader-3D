name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt ruff

      - name: Compile all Python code
        run: python -m compileall -q .

      - name: Check undefined names and local-scope errors
        run: ruff check --select F821,F823 .

      - name: Syntax-check Takeoff Studio JavaScript
        run: node --check planreader_takeoff_studio/frontend/studio.js

      - name: Syntax-check zoomable polygon mapper JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('planreader_floor_mapper_v131/frontend/index.html').read_text(encoding='utf-8')
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/planreader_floor_mapper_v131.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/planreader_floor_mapper_v131.js

      - name: Gemini auth and secret-redaction tests
        run: PYTHONPATH=. python tests/test_gemini_auth.py

      - name: PlanReader take-off accuracy tests
        run: PYTHONPATH=. python tests/test_planreader_accuracy.py

      - name: Floor mapper calibration tests
        run: PYTHONPATH=. python tests/test_floor_mapper_v127.py

      - name: Editable polygon floor mapper tests
        run: PYTHONPATH=. python tests/test_floor_mapper_polygon_v128.py

      - name: Substrate QA and zoom routing tests
        run: PYTHONPATH=. pytest -q tests/test_substrate_qa_v131.py

      - name: Takeoff Studio geometry and safety tests
        run: PYTHONPATH=. python tests/test_takeoff_studio_v1211.py

      - name: Takeoff Studio image-path guard tests
        run: PYTHONPATH=. python tests/test_studio_path_guard_v1213.py

      - name: Quick 3D workflow tests
        run: PYTHONPATH=. python tests/test_3d_quickstart_v1213.py

      - name: Clickable 3D surface editor tests
        run: PYTHONPATH=. python tests/test_3d_surface_editor_v1212.py

      - name: 3D wrapper duplicate-key regression tests
        run: PYTHONPATH=. python tests/test_3d_wrapper_guard_v1214.py

      - name: PlanReader performance optimisation tests
        run: PYTHONPATH=. python tests/test_performance_v1215.py

      - name: One-time database init guard tests
        run: PYTHONPATH=. python tests/test_db_init_guard_v1215.py

      - name: No-AI takeoff tests
        run: PYTHONPATH=. python tests/test_no_ai_takeoff_v1216.py

      - name: Selected-page takeoff tests
        run: PYTHONPATH=. python tests/test_selected_pages_v1217.py

      - name: Subscription core startup regression tests
        run: PYTHONPATH=. python tests/test_subscription_core_guard_v1218.py

      - name: Automatic page triage, calibration and geometry tests
        run: PYTHONPATH=. python tests/test_auto_geometry_v1219.py

      - name: Drawing media and memory stability tests
        run: PYTHONPATH=. python tests/test_memory_stability_v1220.py

      - name: Automatic unit floor area tests
        run: PYTHONPATH=. python tests/test_unit_floor_area_v1221.py

      - name: Finishing schedule material resolver tests
        run: PYTHONPATH=. python tests/test_material_schedule_v1222.py

      - name: End-to-end Autopilot tests
        run: PYTHONPATH=. python tests/test_autopilot_v1223.py

      - name: Autopilot upload and precedence guard tests
        run: PYTHONPATH=. python tests/test_autopilot_guards_v1223.py

      - name: Finish-code context and internal floor-area tests
        run: PYTHONPATH=. python tests/test_context_floorarea_v1224.py

      - name: Reliable registration, quick code register and PB takeoff tests
        run: PYTHONPATH=. python tests/test_registration_pb_takeoff_v1225.py

      - name: Drawing intelligence, selected evidence and takeoff review tests
        run: PYTHONPATH=. python tests/test_drawing_intelligence_v1226.py

      - name: Legend-first abbreviation and code interpretation tests
        run: PYTHONPATH=. python tests/test_legend_register_v1227.py

      - name: Spatial plan reading and mapper hard-guard tests
        run: PYTHONPATH=. pytest -q tests/test_plan_read_engine_v1228.py

      - name: Accuracy v1.3 topology, overhead, cross-view and semantic tests
        run: PYTHONPATH=. pytest -q tests/test_accuracy_v13_engines_v145.py

      - name: Plan processing stability tests
        run: PYTHONPATH=. python tests/test_processing_stability_v129.py

      - name: TradeReader all-trade tests
        run: python -m unittest discover -s tests -p "test_tradereader_all_trades.py" -v

      - name: Smoke test (envelope, quotes, copy, reconcile, publish)
        run: python tests/ci_smoke.py
