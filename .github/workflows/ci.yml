name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile pb_planreader_3d_app.py pb_takeoff_v12.py pb_jobhub_stability_v123.py planreader_line_mapper/__init__.py

      - name: Smoke test (envelope, quotes, copy, reconcile, publish)
        run: python tests/ci_smoke.py
