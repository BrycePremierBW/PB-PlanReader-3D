name: Performance Fastpath CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  fastpath:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Compile performance and startup modules
        run: python -m py_compile pb_runtime_performance_v149.py pb_processing_fastpath_v150.py pb_startup_bootstrap_v151.py pb_persistent_login_v1229.py pb_planreader_v133_app.py
      - name: Runtime rerun fastpath tests
        run: PYTHONPATH=. pytest -q tests/test_runtime_performance_v149.py
      - name: Cold-start and remembered-login tests
        run: PYTHONPATH=. pytest -q tests/test_startup_fastpath_v151.py
      - name: Processing caching and ETA tests
        run: PYTHONPATH=. pytest -q tests/test_processing_fastpath_v150.py
