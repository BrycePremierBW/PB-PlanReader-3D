name: P5 B0-B6 temporary validation
on:
  push:
    branches:
      - feature/opening-evidence-pipeline
      - integration/p5-opening-pipeline
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run P5 tests
        run: |
          python -m pytest -q \
            tests/test_opening_evidence_v170.py \
            tests/test_plan_opening_detection_v171.py \
            tests/test_opening_schedule_v171.py \
            tests/test_elevation_evidence_v172.py \
            tests/test_opening_reconciliation_v173.py \
            tests/test_opening_deduction_v174.py \
            tests/test_pipeline_integration_v174.py \
            tests/test_lago_benchmark_v174.py \
            tests/test_opening_safety_fence_v175.py
