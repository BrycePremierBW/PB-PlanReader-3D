<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0c1119;--panel:#121923;--panel2:#17202c;--line:#2b3646;--text:#eef3f8;--muted:#93a0b2;--blue:#2476e8;--green:#56b43c;--orange:#ff6b27;--red:#dc3b43}
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}
.studio{background:linear-gradient(180deg,#0e141d,#0a0f16);border:1px solid #222c39;border-radius:10px;overflow:hidden;min-height:870px;box-shadow:0 16px 44px rgba(0,0,0,.24)}
.header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:#0d131c}.brand{display:flex;gap:10px;align-items:center;font-weight:750;letter-spacing:.01em}.brandmark{display:grid;place-items:center;width:27px;height:27px;border:1px solid #68778b;border-radius:6px;font-size:12px}.headmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.pill{border:1px solid #344154;border-radius:5px;padding:6px 9px;color:#d9e1ec;background:#121a25}.pill.active{border-color:#236fd6;background:#132c50;color:#8dc0ff}
.bodygrid{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;min-height:760px}.side{background:rgba(14,20,29,.98);padding:14px 12px;border-right:1px solid var(--line);overflow:auto}.side.right{border-right:0;border-left:1px solid var(--line)}
.section{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #273140}.section:last-child{border-bottom:0}.section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.025em;margin-bottom:10px}.legend-row{display:flex;gap:8px;align-items:center;padding:4px 3px;border-radius:5px;cursor:pointer;font-size:12px;color:#d8e0e9}.legend-row:hover{background:#1b2532}.swatch{width:14px;height:14px;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:0 0 14px}.legend-code{font-weight:800;min-width:31px;color:#fff}.legend-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bac5d2}
.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tool{border:1px solid #263141;border-radius:5px;background:#151d28;color:#dbe3ed;min-height:53px;padding:5px 3px;font-size:11px;cursor:pointer}.tool:hover{background:#1b2634}.tool.active{background:#1165d3;border-color:#247ef2;color:#fff}.tool.danger{color:#f49094}.tool:disabled{opacity:.38;cursor:not-allowed}.tool .ico{display:block;font-size:18px;margin-bottom:2px}
.radio,.toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:#c8d1dc;margin:8px 0}.radio input,.toggle input{accent-color:#2e7df0}.viewitem{border:1px solid #273241;background:#141c27;padding:7px 8px;border-radius:4px;margin:5px 0;font-size:12px;color:#bbc6d2}.viewitem.active{border-color:#1873dc;color:#83baff;background:#122740}
.canvas-col{position:relative;min-width:0;background:#090d13;display:flex;flex-direction:column}.canvas-toolbar{height:43px;display:flex;gap:8px;align-items:center;padding:0 10px;border-bottom:1px solid #273140;background:#101720;color:#9eabbc;font-size:12px}.canvas-toolbar .strong{color:#fff;font-weight:700}.canvas-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#253242,#0a0f16 75%);min-height:650px}.stage{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0;user-select:none;touch-action:none}.stage img{display:block;max-width:100%;max-height:650px;width:auto;height:auto;object-fit:contain;transition:filter .2s,opacity .2s}.stage.xray img{filter:grayscale(.9) contrast(1.25);opacity:.42}.overlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2;touch-action:none}.area{stroke-width:2;vector-effect:non-scaling-stroke;cursor:move;pointer-events:all}.area.selected{stroke:#1687ff!important;stroke-width:3;stroke-dasharray:7 4}.area.hidden{display:none}.draft{fill:rgba(36,118,232,.18);stroke:#2d8dff;stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}.vertex{fill:#eaf4ff;stroke:#1687ff;stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab;pointer-events:all}.mid{fill:#0d131c;stroke:#91bdf1;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:copy;pointer-events:all}.chip{position:absolute;z-index:4;transform:translate(-50%,-50%);background:#176dd8;border:1px solid #65a5f4;color:#fff;border-radius:5px;padding:5px 7px;font-size:11px;line-height:1.25;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,.35);white-space:nowrap}.chip.hidden{display:none}
.stats{height:72px;margin:10px 12px 12px;border:1px solid #48515f;border-radius:6px;background:rgba(14,20,29,.92);display:grid;grid-template-columns:1.55fr repeat(3,1fr);align-items:center}.stat{padding:0 14px;border-right:1px solid #2b3440}.stat:last-child{border-right:0}.stat .k{font-size:11px;color:#a9b3c0;margin-bottom:5px}.stat .v{font-size:17px;color:#fff}.stat .v.green{color:#55b840}.stat .v.orange{color:#ff6d2b}.modehint{font-size:12px;color:#bac3cf;line-height:1.4}.modehint strong{display:block;color:#fff;margin-bottom:3px;text-transform:uppercase;font-size:12px}
.field{margin-bottom:12px}.field label{display:block;color:#acb7c4;font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #2d3949;background:#19222e;color:#e7edf4;border-radius:4px;padding:8px 9px;font-size:12px;outline:none}.field textarea{height:75px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#277ae7}.area-readout{display:flex;align-items:center;justify-content:space-between;background:#18212c;border:1px solid #2d3949;border-radius:4px;padding:9px}.area-readout .big{font-size:13px;color:#dce5ef}.unit{color:#7e8a9a}.progressrow{display:flex;justify-content:space-between;align-items:center;margin:3px 0 7px;font-size:11px;color:#a8b2be}.progressval{border:1px solid #364153;border-radius:4px;padding:4px 8px;color:#dfe7ef}.range{width:100%;accent-color:#2f82ed}.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #273140;font-size:11px}.kv span:first-child{color:#aab4c1}.kv .done{color:#62bd48}.kv .remain{color:#ff6b2d}.action{width:100%;border:0;border-radius:4px;padding:9px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;margin-top:7px}.action.blue{background:#176bd7}.action.red{background:#c9363d}.action.ghost{background:#1a2430;border:1px solid #344153;color:#c9d3de}.empty{padding:10px;border:1px dashed #384557;border-radius:6px;color:#94a1b2;font-size:12px;line-height:1.45}.footer{border-top:1px solid #202936;padding:9px 14px;color:#8b97a7;font-size:10px;background:#0d131b}.exportbar{display:flex;gap:8px}.exportbar button{border:1px solid #394658;background:#111a25;color:#dce4ee;border-radius:5px;padding:8px 12px;font-size:11px;cursor:pointer}.exportbar button:hover{background:#182435}
@media(max-width:980px){.bodygrid{grid-template-columns:190px minmax(0,1fr)}.side.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.side.right>.section,.side.right>.rightcontent{border:0;margin:0}.canvas-wrap{min-height:520px}.stage img{max-height:520px}.stats{grid-template-columns:repeat(2,1fr);height:auto}.stat{padding:10px;border-bottom:1px solid #2b3440}}
@media(max-width:680px){.bodygrid{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.legend-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.canvas-wrap{min-height:390px}.stage img{max-height:390px}.stats{grid-template-columns:1fr 1fr}.headmeta{display:none}.side.right{display:block}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const root=document.getElementById('root'),NS='http://www.w3.org/2000/svg';
const DEFAULT_SUBS=[
 {code:'EC1',name:'Lineaboard Cladding',color:'#a9bfd9'},{code:'EC2',name:'Textureboard Cladding',color:'#a5b9db'},{code:'EC3',name:'Easylap Cladding',color:'#b7c4d5'},{code:'RBL',name:'Rendered Block',color:'#b9c0c4'},{code:'SOF',name:'Soffits / Eaves',color:'#d9c788'},{code:'EC5',name:'Timber Look Cladding',color:'#a77c52'},{code:'SCR',name:'Aluminium Screens',color:'#bea8b5'},{code:'BA1',name:'Glass Balustrade',color:'#b9c7c8'},{code:'SHD',name:'Sunhoods',color:'#919b8d'},{code:'BC',name:'Cappings & Gutters',color:'#9aa7aa'},{code:'RS',name:'Roof Sheet',color:'#c45f74'},{code:'DP',name:'Downpipes',color:'#84a77e'},{code:'GD',name:'Garage Doors',color:'#7e8792'}
];
const state={image:'',areas:[],subs:DEFAULT_SUBS,pxPerM:0,pageType:'',viewLabel:'',revision:-1,selected:null,mode:'select',drag:null,draft:[],draftRect:null,natW:0,natH:0,xray:false,showSoffits:true,history:[],future:[]};
function post(type,payload){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},payload||{}),'*')}
function n(v,d){v=parseFloat(v);return Number.isFinite(v)?v:d}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function r2(v){return Math.round(v*100)/100}
function deep(v){return JSON.parse(JSON.stringify(v))}
function pt(v){return{x:clamp(n(v&&v.x,0),0,100),y:clamp(n(v&&v.y,0),0,100)}}
function boxPoints(raw){const x=clamp(n(raw.x,15),0,100),y=clamp(n(raw.y,15),0,100),w=Math.max(1,n(raw.w,20)),h=Math.max(1,n(raw.h,12));return[{x:x,y:y},{x:clamp(x+w,0,100),y:y},{x:clamp(x+w,0,100),y:clamp(y+h,0,100)},{x:x,y:clamp(y+h,0,100)}]}
function nextId(){let max=0;state.areas.forEach(a=>{const m=String(a.id||'').match(/(\d+)/);if(m)max=Math.max(max,parseInt(m[1],10)||0)});return 'A-'+String(max+1).padStart(3,'0')}
function normalizeArea(raw,i){const points=Array.isArray(raw.points)&&raw.points.length>=3?raw.points.map(pt):boxPoints(raw||{});return{id:String(raw.id||('A-'+String(i+1).padStart(3,'0'))),label:String(raw.label||raw.id||('Area '+(i+1))),substrate:String(raw.substrate||(state.subs[0]&&state.subs[0].code)||'OTHER'),elevation:String(raw.elevation||state.viewLabel||''),status:String(raw.status||'Paint Included'),progress_pct:clamp(n(raw.progress_pct,0),0,100),notes:String(raw.notes||''),manual_m2:Math.max(0,n(raw.manual_m2,0)),points:points}}
function serial(){return state.areas.map((a,i)=>normalizeArea(a,i))}
function pushHistory(){state.history.push(deep(serial()));if(state.history.length>40)state.history.shift();state.future=[]}
function restore(items){state.areas=(items||[]).map((x,i)=>normalizeArea(x,i));if(state.selected&&!state.areas.some(a=>a.id===state.selected))state.selected=state.areas.length?state.areas[0].id:null;value();render()}
function undo(){if(!state.history.length)return;state.future.push(deep(serial()));restore(state.history.pop())}
function redo(){if(!state.future.length)return;state.history.push(deep(serial()));restore(state.future.pop())}
function value(){state.areas=serial();post('streamlit:setComponentValue',{value:{areas:state.areas},dataType:'json'})}
function subFor(code){return state.subs.find(s=>String(s.code)===String(code))||{code:code||'OTHER',name:code||'Other',color:'#80a6c9'}}
function rgba(hex,a){let h=String(hex||'#80a6c9').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const q=parseInt(h,16);if(!Number.isFinite(q))return 'rgba(80,166,201,'+a+')';return 'rgba('+((q>>16)&255)+','+((q>>8)&255)+','+(q&255)+','+a+')'}
function polyPxArea(points){if(!state.natW||!state.natH||!Array.isArray(points)||points.length<3)return 0;let s=0;for(let i=0;i<points.length;i++){const a=points[i],b=points[(i+1)%points.length],ax=a.x/100*state.natW,ay=a.y/100*state.natH,bx=b.x/100*state.natW,by=b.y/100*state.natH;s+=ax*by-bx*ay}return Math.abs(s)/2}
function areaM2(a){if(n(a.manual_m2,0)>0)return n(a.manual_m2,0);return state.pxPerM>0?polyPxArea(a.points)/(state.pxPerM*state.pxPerM):0}
function summary(){let total=0,completed=0;state.areas.forEach(a=>{if(a.status==='Excluded')return;const m=areaM2(a);total+=m;completed+=m*clamp(n(a.progress_pct,0),0,100)/100});return{total:total,completed:completed,remaining:Math.max(0,total-completed),pct:total>0?completed/total*100:0}}
function centroid(points){let x=0,y=0;if(!points.length)return{x:0,y:0};points.forEach(p=>{x+=p.x;y+=p.y});return{x:x/points.length,y:y/points.length}}
function selected(){return state.areas.find(a=>a.id===state.selected)||null}
function pos(ev){const img=document.getElementById('bg');if(!img)return{x:0,y:0};const r=img.getBoundingClientRect();return{x:clamp((ev.clientX-r.left)/r.width*100,0,100),y:clamp((ev.clientY-r.top)/r.height*100,0,100)}}
function svgEl(name,attrs){const e=document.createElementNS(NS,name);Object.keys(attrs||{}).forEach(k=>e.setAttribute(k,String(attrs[k])));return e}
function pointsAttr(ps){return ps.map(p=>p.x+','+p.y).join(' ')}
function visible(a){return state.showSoffits||String(a.substrate).toUpperCase()!=='SOF'}
function modeHint(){if(state.mode==='box')return '<strong>Draw box mode</strong>Click and drag over any area.';if(state.mode==='poly')return '<strong>Draw polygon mode</strong>Click each corner; double-click or press Finish.';return '<strong>Select mode</strong>Select an area, move it, or drag its blue corner points.'}
function render(){
 const s=summary();
 root.innerHTML='<div class="studio"><div class="header"><div class="brand"><span class="brandmark">PB</span><span>PlanReader Takeoff Studio</span></div><div class="headmeta"><span class="pill active">TAKEOFF STUDIO</span><span class="pill">'+escapeHtml(state.pageType||'Drawing')+'</span><span class="pill">'+escapeHtml(state.viewLabel||'Current view')+'</span></div></div><div class="bodygrid"><aside class="side" id="left"></aside><main class="canvas-col"><div class="canvas-toolbar"><span class="strong">'+escapeHtml(state.viewLabel||'Drawing view')+'</span><span>·</span><span>'+escapeHtml(state.pageType||'')+'</span><span style="margin-left:auto" id="scaleTxt"></span></div><div class="canvas-wrap" id="canvasWrap"></div><div class="stats"><div class="stat"><div class="modehint">'+modeHint()+'</div></div><div class="stat"><div class="k">Total Areas</div><div class="v">'+fmt(s.total)+' m²</div></div><div class="stat"><div class="k">Completed</div><div class="v green">'+fmt(s.completed)+' m² ('+fmt(s.pct,1)+'%)</div></div><div class="stat"><div class="k">Remaining</div><div class="v orange">'+fmt(s.remaining)+' m²</div></div></div></main><aside class="side right" id="right"></aside></div><div class="footer">Measurements from calibrated elevations are scale-based. Areas drawn on perspective renders are visual/provisional unless manually verified.</div></div>';
 renderLeft();renderStage();renderRight();document.getElementById('scaleTxt').textContent=state.pxPerM>0?fmt(state.pxPerM)+' px/m · calibrated':'Scale not calibrated';resizeFrame();
}
function renderLeft(){const left=document.getElementById('left');let legend='<div class="section"><div class="section-title">Substrate legend</div><div class="legend-list">';state.subs.forEach(s=>{legend+='<div class="legend-row" data-sub="'+attr(s.code)+'"><span class="swatch" style="background:'+attr(s.color)+'"></span><span class="legend-code">'+escapeHtml(s.code)+'</span><span class="legend-name">'+escapeHtml(s.name)+'</span></div>'});legend+='</div></div>';
 left.innerHTML=legend+'<div class="section"><div class="section-title">Tools</div><div class="toolgrid"><button class="tool '+(state.mode==='select'?'active':'')+'" id="selectTool"><span class="ico">⌖</span>Select</button><button class="tool '+(state.mode==='box'?'active':'')+'" id="boxTool"><span class="ico">▧</span>Draw Box</button><button class="tool '+(state.mode==='poly'?'active':'')+'" id="polyTool"><span class="ico">⬠</span>Polygon</button><button class="tool" id="undoTool" '+(!state.history.length?'disabled':'')+'><span class="ico">↶</span>Undo</button><button class="tool" id="redoTool" '+(!state.future.length?'disabled':'')+'><span class="ico">↷</span>Redo</button><button class="tool danger" id="clearTool"><span class="ico">⌫</span>Clear All</button></div>'+(state.mode==='poly'&&state.draft.length?'<button class="action blue" id="finishPoly">Finish polygon</button>':'')+'</div><div class="section"><div class="section-title">View options</div><label class="radio"><input type="radio" name="viewmode" value="real" '+(!state.xray?'checked':'')+'> Realistic</label><label class="radio"><input type="radio" name="viewmode" value="xray" '+(state.xray?'checked':'')+'> X-Ray / Transparent</label><label class="toggle"><input type="checkbox" id="showSoffits" '+(state.showSoffits?'checked':'')+'> Show soffits</label></div><div class="section"><div class="section-title">Model views</div><div class="viewitem active">▧ '+escapeHtml(state.viewLabel||'Current drawing')+'</div><div class="viewitem">◫ Elevation overlay</div><div class="viewitem">⌂ 3D model in PlanReader tab</div></div>';
 left.querySelectorAll('.legend-row').forEach(el=>el.addEventListener('click',()=>{const a=selected();if(a){pushHistory();a.substrate=el.dataset.sub;value();render()}}));
 left.querySelector('#selectTool').onclick=()=>{state.mode='select';state.draft=[];state.draftRect=null;render()};left.querySelector('#boxTool').onclick=()=>{state.mode='box';state.draft=[];render()};left.querySelector('#polyTool').onclick=()=>{state.mode='poly';state.draft=[];render()};left.querySelector('#undoTool').onclick=undo;left.querySelector('#redoTool').onclick=redo;left.querySelector('#clearTool').onclick=()=>{if(state.areas.length&&confirm('Clear all Takeoff Studio areas on this drawing?')){pushHistory();state.areas=[];state.selected=null;value();render()}};
 const fp=left.querySelector('#finishPoly');if(fp)fp.onclick=finishPolygon;left.querySelectorAll('input[name="viewmode"]').forEach(r=>r.onchange=()=>{state.xray=r.value==='xray';render()});left.querySelector('#showSoffits').onchange=e=>{state.showSoffits=!!e.target.checked;render()};
}
function renderStage(){const wrap=document.getElementById('canvasWrap');if(!state.image){wrap.innerHTML='<div class="empty">No rendered drawing image is available for this page.</div>';return}const stage=document.createElement('div');stage.className='stage'+(state.xray?' xray':'');stage.id='stage';const img=document.createElement('img');img.id='bg';img.src=state.image;img.alt='PlanReader drawing';stage.appendChild(img);const svg=svgEl('svg',{class:'overlay',viewBox:'0 0 100 100',preserveAspectRatio:'none'});svg.id='overlay';stage.appendChild(svg);wrap.appendChild(stage);img.onload=()=>{state.natW=img.naturalWidth;state.natH=img.naturalHeight;drawOverlay();resizeFrame()};if(img.complete&&img.naturalWidth){state.natW=img.naturalWidth;state.natH=img.naturalHeight;drawOverlay()}bindCanvas(svg)}
function drawOverlay(){const svg=document.getElementById('overlay'),stage=document.getElementById('stage');if(!svg||!stage)return;svg.innerHTML='';stage.querySelectorAll('.chip').forEach(e=>e.remove());state.areas.forEach(a=>{const sub=subFor(a.substrate),poly=svgEl('polygon',{points:pointsAttr(a.points),class:'area'+(a.id===state.selected?' selected':'')+(visible(a)?'':' hidden'),fill:rgba(sub.color,a.id===state.selected?.30:.17),stroke:sub.color});poly.dataset.id=a.id;poly.addEventListener('pointerdown',ev=>{if(state.mode!=='select')return;ev.preventDefault();ev.stopPropagation();state.selected=a.id;pushHistory();const q=pos(ev);state.drag={kind:'move',id:a.id,start:q,points:deep(a.points)};svg.setPointerCapture(ev.pointerId);renderRight();drawOverlay()});svg.appendChild(poly);
  if(a.id===state.selected&&visible(a)){a.points.forEach((p,i)=>{const v=svgEl('circle',{cx:p.x,cy:p.y,r:.85,class:'vertex'});v.addEventListener('pointerdown',ev=>{if(state.mode!=='select')return;ev.preventDefault();ev.stopPropagation();pushHistory();state.drag={kind:'vertex',id:a.id,index:i};svg.setPointerCapture(ev.pointerId)});svg.appendChild(v);const b=a.points[(i+1)%a.points.length],m={x:(p.x+b.x)/2,y:(p.y+b.y)/2},mid=svgEl('circle',{cx:m.x,cy:m.y,r:.48,class:'mid'});mid.addEventListener('pointerdown',ev=>{if(state.mode!=='select')return;ev.preventDefault();ev.stopPropagation();pushHistory();a.points.splice(i+1,0,pt(m));value();drawOverlay();renderRight()});svg.appendChild(mid)})}
  if(visible(a)){const c=centroid(a.points),chip=document.createElement('div');chip.className='chip';chip.style.left=c.x+'%';chip.style.top=c.y+'%';chip.innerHTML='<b>'+escapeHtml(a.substrate||'AREA')+'</b><br>'+fmt(areaM2(a))+' m²';stage.appendChild(chip)}});
 if(state.mode==='poly'&&state.draft.length){const d=svgEl('polyline',{points:pointsAttr(state.draft),class:'draft',fill:'none'});svg.appendChild(d);state.draft.forEach(p=>svg.appendChild(svgEl('circle',{cx:p.x,cy:p.y,r:.75,class:'vertex'})))}
 if(state.mode==='box'&&state.draftRect){const p=state.draftRect,pts=[p.a,{x:p.b.x,y:p.a.y},p.b,{x:p.a.x,y:p.b.y}];svg.appendChild(svgEl('polygon',{points:pointsAttr(pts),class:'draft'}))}
}
function bindCanvas(svg){svg.addEventListener('pointerdown',ev=>{if(ev.target!==svg)return;const q=pos(ev);if(state.mode==='box'){ev.preventDefault();state.drag={kind:'box',start:q};state.draftRect={a:q,b:q};svg.setPointerCapture(ev.pointerId);drawOverlay()}else if(state.mode==='poly'){ev.preventDefault();state.draft.push(pt(q));drawOverlay()}else{state.selected=null;drawOverlay();renderRight()}});svg.addEventListener('dblclick',ev=>{if(state.mode==='poly'){ev.preventDefault();finishPolygon()}});svg.addEventListener('pointermove',ev=>{if(!state.drag)return;const q=pos(ev);if(state.drag.kind==='box'){state.draftRect={a:state.drag.start,b:q};drawOverlay();return}const a=state.areas.find(x=>x.id===state.drag.id);if(!a)return;if(state.drag.kind==='vertex'){a.points[state.drag.index]=pt(q)}else if(state.drag.kind==='move'){const dx=q.x-state.drag.start.x,dy=q.y-state.drag.start.y;a.points=state.drag.points.map(p=>({x:clamp(p.x+dx,0,100),y:clamp(p.y+dy,0,100)}))}drawOverlay();renderRight()});svg.addEventListener('pointerup',ev=>{if(!state.drag)return;if(state.drag.kind==='box'){const p=state.draftRect;state.drag=null;state.draftRect=null;if(p&&Math.abs(p.b.x-p.a.x)>1&&Math.abs(p.b.y-p.a.y)>1){pushHistory();const x1=Math.min(p.a.x,p.b.x),x2=Math.max(p.a.x,p.b.x),y1=Math.min(p.a.y,p.b.y),y2=Math.max(p.a.y,p.b.y);addArea([{x:x1,y:y1},{x:x2,y:y1},{x:x2,y:y2},{x:x1,y:y2}])}else render()}else{state.drag=null;value();drawOverlay();renderRight()}})}
function addArea(points){const id=nextId(),a=normalizeArea({id:id,label:id,points:points,substrate:(state.subs[0]&&state.subs[0].code)||'OTHER',elevation:state.viewLabel,status:'Paint Included',progress_pct:0},state.areas.length);state.areas.push(a);state.selected=id;value();state.mode='select';render()}
function finishPolygon(){if(state.draft.length<3)return;pushHistory();const ps=deep(state.draft);state.draft=[];addArea(ps)}
function renderRight(){const right=document.getElementById('right');if(!right)return;const a=selected();if(!a){right.innerHTML='<div class="section"><div class="section-title">Selected area</div><div class="empty">Select an existing area or use <b>Draw Box</b> / <b>Polygon</b> to create one.</div></div><div class="section"><div class="section-title">Export</div><div class="exportbar"><button id="csvBtn">Export CSV</button><button id="pngBtn">Download Image</button></div></div>';right.querySelector('#csvBtn').onclick=downloadCsv;right.querySelector('#pngBtn').onclick=downloadImage;return}const s=summary(),m=areaM2(a),done=m*a.progress_pct/100,rem=Math.max(0,m-done);let opts='';state.subs.forEach(q=>opts+='<option value="'+attr(q.code)+'" '+(q.code===a.substrate?'selected':'')+'>'+escapeHtml(q.code+' '+q.name)+'</option>');right.innerHTML='<div class="section"><div class="section-title">Selected area</div><div class="kv"><span>ID</span><b>'+escapeHtml(a.id)+'</b></div></div><div class="rightcontent"><div class="field"><label>Area label</label><input id="label" value="'+attr(a.label)+'"></div><div class="field"><label>Substrate</label><select id="substrate">'+opts+'</select></div><div class="field"><label>Elevation / View</label><input id="elev" value="'+attr(a.elevation||state.viewLabel)+'"></div><div class="field"><label>Area (m²)</label><div class="area-readout"><span class="big">'+(m>0?fmt(m):'To measure')+'</span><span class="unit">m²</span></div></div><div class="field"><label>Manual m² override (optional)</label><input id="manual" type="number" min="0" step="0.01" value="'+(a.manual_m2>0?attr(a.manual_m2):'')+'"></div><div class="field"><label>Status</label><select id="status"><option '+sel(a.status,'Paint Included')+'>Paint Included</option><option '+sel(a.status,'Separate Item')+'>Separate Item</option><option '+sel(a.status,'Provisional')+'>Provisional</option><option '+sel(a.status,'Excluded')+'>Excluded</option></select></div><div class="field"><label>Progress</label><div class="progressrow"><span>Completion</span><span class="progressval">'+fmt(a.progress_pct,0)+' %</span></div><input class="range" id="progress" type="range" min="0" max="100" step="1" value="'+attr(a.progress_pct)+'"><div class="kv"><span>Completed</span><span class="done">'+fmt(done)+' m²</span></div><div class="kv"><span>Remaining</span><span class="remain">'+fmt(rem)+' m²</span></div></div><div class="field"><label>Notes</label><textarea id="notes">'+escapeHtml(a.notes)+'</textarea></div><button class="action blue" id="update">Update area</button><button class="action red" id="delete">Delete area</button></div><div class="section"><div class="section-title">Export</div><div class="exportbar"><button id="csvBtn">Export CSV</button><button id="pngBtn">Download Image</button></div></div>';

}

function downloadCsv(){const rows=[['ID','Label','Substrate','Elevation','Area m2','Status','Progress %','Completed m2','Remaining m2','Notes']];state.areas.forEach(a=>{const m=areaM2(a),d=m*a.progress_pct/100;rows.push([a.id,a.label,a.substrate,a.elevation,r2(m),a.status,r2(a.progress_pct),r2(d),r2(m-d),a.notes])});const csv=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'planreader_takeoff_studio.csv')}
function downloadImage(){const img=document.getElementById('bg');if(!img||!img.naturalWidth)return;const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);x.lineWidth=Math.max(2,c.width/700*2);x.font=Math.max(12,c.width/90)+'px sans-serif';state.areas.forEach(a=>{if(!visible(a))return;const sub=subFor(a.substrate);x.beginPath();a.points.forEach((p,i)=>{const px=p.x/100*c.width,py=p.y/100*c.height;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fillStyle=rgba(sub.color,.23);x.strokeStyle=sub.color;x.fill();x.stroke();const cc=centroid(a.points);x.fillStyle='rgba(15,25,38,.88)';const txt=(a.substrate||'AREA')+' '+fmt(areaM2(a))+' m²';const tw=x.measureText(txt).width+18,th=Math.max(24,c.width/80);x.fillRect(cc.x/100*c.width-tw/2,cc.y/100*c.height-th/2,tw,th);x.fillStyle='#ffffff';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,cc.x/100*c.width,cc.y/100*c.height)});c.toBlob(b=>{if(b)downloadBlob(b,'planreader_takeoff_overlay.png')},'image/png')}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}

function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

window.addEventListener('message',ev=>{const d=ev.data;if(!d||d.type!=='streamlit:render')return;const a=d.args||d,rev=n(a.revision,0),image=String(a.image||'');if(state.image!==image||state.revision!==rev){state.image=image;state.revision=rev;state.subs=Array.isArray(a.substrates)&&a.substrates.length?a.substrates.map(s=>({code:String(s.code||'OTHER'),name:String(s.name||s.code||'Other'),color:String(s.color||'#80a6c9')})):DEFAULT_SUBS;state.pxPerM=Math.max(0,n(a.px_per_m,0));state.pageType=String(a.page_type||'');state.viewLabel=String(a.view_label||'');state.areas=Array.isArray(a.areas)?a.areas.map((x,i)=>normalizeArea(x,i)):[];state.selected=state.areas.length?state.areas[0].id:null;state.mode='select';state.drag=null;state.draft=[];state.draftRect=null;state.history=[];state.future=[]}else{state.pxPerM=Math.max(0,n(a.px_per_m,state.pxPerM));state.pageType=String(a.page_type||state.pageType);state.viewLabel=String(a.view_label||state.viewLabel)}render()});
window.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&state.mode==='poly'&&state.draft.length>=3){ev.preventDefault();finishPolygon()}else if(ev.key==='Escape'){state.mode='select';state.draft=[];state.draftRect=null;render()}else if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo()}});
