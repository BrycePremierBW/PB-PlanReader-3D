services:
  - type: web
    name: tradereader-3d
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run tradereader_v12_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PLANREADER_DATA_DIR
        value: /var/data/tradereader
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_PROVIDER
        value: OpenAI
      - key: TRADEREADER_PASSWORD
        sync: false
    disk:
      name: tradereader-data
      mountPath: /var/data
      sizeGB: 10
