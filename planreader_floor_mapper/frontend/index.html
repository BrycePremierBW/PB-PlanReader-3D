<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
button{border:1px solid #8b6f47;background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}
button.primary{background:#8b6f47;color:#fff}button.danger{border-color:#c84040;color:#a22222}button:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:#665f56;margin:6px 0 10px;line-height:1.45}
.stage{position:relative;display:inline-block;max-width:100%;line-height:0;user-select:none;touch-action:none}
.stage img{display:block;max-width:100%;height:auto;border-radius:8px}
.overlay{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2;touch-action:none}
.area-poly{fill:rgba(215,162,27,.18);stroke:#d7a21b;stroke-width:2;vector-effect:non-scaling-stroke;cursor:move;pointer-events:all}
.area-poly.selected{fill:rgba(215,162,27,.28);stroke:#171717;stroke-width:3}
.area-poly.draft{fill:rgba(46,139,87,.10);stroke:#2e8b57;stroke-dasharray:7 5;cursor:crosshair}
.vertex{fill:#fff;stroke:#2e8b57;stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab;pointer-events:all}
.vertex.active{fill:#2e8b57}.midpoint{fill:#fff;stroke:#8b6f47;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:copy;pointer-events:all;opacity:.9}
.vertex.first{stroke:#b33a3a;stroke-width:3}
.area-chip{position:absolute;z-index:3;background:rgba(23,23,23,.88);color:#fff;border-radius:5px;padding:4px 7px;font-size:12px;line-height:1.2;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%)}
.cal{position:absolute;height:3px;background:#b33a3a;transform-origin:left center;z-index:4;pointer-events:none}.cal:before,.cal:after{content:"";position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:#b33a3a}.cal:before{left:-5px}.cal:after{right:-5px}
.editor{margin-top:12px;border:1px solid #e0d8cc;border-radius:9px;padding:10px;max-width:660px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}label{font-size:12px;color:#6a625a;display:block;margin-bottom:3px}input{width:100%;box-sizing:border-box;padding:7px 8px;border:1px solid #ccc;border-radius:7px;font-size:14px}.metric{font-weight:700;margin-top:6px}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tip{font-size:12px;color:#6a625a;margin-top:7px;line-height:1.4}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const root=document.getElementById('root');
const NS='http://www.w3.org/2000/svg';
const state={image:'',boxes:[],calibration:null,revision:-1,selected:null,mode:'',drag:null,natW:0,natH:0,draft:[]};
function post(type,payload){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},payload||{}),'*')}
function n(v,d){v=parseFloat(v);return Number.isFinite(v)?v:d}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function p2(v){return Math.round(v*100)/100}
function point(raw){if(Array.isArray(raw))return{x:clamp(n(raw[0],0),0,100),y:clamp(n(raw[1],0),0,100)};return{x:clamp(n(raw&&raw.x,0),0,100),y:clamp(n(raw&&raw.y,0),0,100)}}
function legacyPoints(b){const x=n(b.x,15),y=n(b.y,15),w=Math.max(1,n(b.w,35)),h=Math.max(1,n(b.h,30));return[{x:x,y:y},{x:clamp(x+w,0,100),y:y},{x:clamp(x+w,0,100),y:clamp(y+h,0,100)},{x:x,y:clamp(y+h,0,100)}]}
function bbox(points){if(!points.length)return{x:0,y:0,w:0,h:0};const xs=points.map(p=>p.x),ys=points.map(p=>p.y),x=Math.min(...xs),y=Math.min(...ys),x2=Math.max(...xs),y2=Math.max(...ys);return{x:p2(x),y:p2(y),w:p2(x2-x),h:p2(y2-y)}}
function normalizeBox(raw,i){const points=Array.isArray(raw.points)&&raw.points.length>=3?raw.points.map(point):legacyPoints(raw);const bb=bbox(points);return{id:raw.id||('floor-'+Date.now()+'-'+i),label:String(raw.label||('Floor area '+(i+1))),points:points,manual_m2:n(raw.manual_m2,0),x:bb.x,y:bb.y,w:bb.w,h:bb.h}}
function serializedBoxes(){return state.boxes.map(b=>{const bb=bbox(b.points);return{id:b.id,label:b.label,points:b.points.map(p=>({x:p2(p.x),y:p2(p.y)})),manual_m2:n(b.manual_m2,0),x:bb.x,y:bb.y,w:bb.w,h:bb.h}})}
function value(){state.boxes=serializedBoxes();post('streamlit:setComponentValue',{value:{boxes:state.boxes,calibration:state.calibration},dataType:'json'})}
function stageImg(){return document.getElementById('bg')}
function pos(ev){const img=stageImg();if(!img)return{x:0,y:0};const r=img.getBoundingClientRect();return{x:clamp((ev.clientX-r.left)/r.width*100,0,100),y:clamp((ev.clientY-r.top)/r.height*100,0,100)}}
function pxPerM(){const c=state.calibration;if(!c||!state.natW||!state.natH||!(n(c.len_m,0)>0))return 0;const dx=(n(c.x2,0)-n(c.x1,0))/100*state.natW,dy=(n(c.y2,0)-n(c.y1,0))/100*state.natH;const px=Math.hypot(dx,dy);return px>1?px/n(c.len_m,1):0}
function polygonPxArea(points){if(!Array.isArray(points)||points.length<3||!state.natW||!state.natH)return 0;let twice=0;for(let i=0;i<points.length;i++){const a=points[i],b=points[(i+1)%points.length];const ax=a.x/100*state.natW,ay=a.y/100*state.natH,bx=b.x/100*state.natW,by=b.y/100*state.natH;twice+=ax*by-bx*ay}return Math.abs(twice)/2}
function area(b){const manual=n(b.manual_m2,0);if(manual>0)return manual;const ppm=pxPerM();if(!ppm)return 0;return polygonPxArea(b.points)/(ppm*ppm)}
function centroid(points){if(!points.length)return{x:0,y:0};let x=0,y=0;points.forEach(p=>{x+=p.x;y+=p.y});return{x:x/points.length,y:y/points.length}}
function chip(b){const a=area(b);return (b.label||'Floor area')+(a>0?' · '+p2(a)+' m²':'')}
function svgEl(name,attrs){const el=document.createElementNS(NS,name);Object.keys(attrs||{}).forEach(k=>el.setAttribute(k,String(attrs[k])));return el}
function pointsAttr(points){return points.map(p=>p.x+','+p.y).join(' ')}
function startDraw(){state.mode='draw';state.draft=[];state.drag=null;state.selected=null;render()}
function finishDraw(){if(state.draft.length<3)return;const i=state.boxes.length+1;const b={id:'floor-'+Date.now()+'-'+i,label:'Floor area '+i,points:state.draft.map(point),manual_m2:0};state.boxes.push(b);state.selected=b.id;state.mode='';state.draft=[];value();render()}
function cancelMode(){state.mode='';state.draft=[];state.drag=null;render()}
function addRectangle(){const i=state.boxes.length+1;const b=normalizeBox({id:'floor-'+Date.now()+'-'+i,label:'Floor area '+i,x:15,y:15,w:35,h:30,manual_m2:0},i-1);state.boxes.push(b);state.selected=b.id;value();render()}
function setCalibration(x1,y1,x2,y2){const metres=parseFloat(window.prompt('Known real-world distance in metres:','10'));if(!(metres>0)){cancelMode();return}state.calibration={x1:p2(x1),y1:p2(y1),x2:p2(x2),y2:p2(y2),len_m:p2(metres)};state.mode='';state.drag=null;value();render()}
function selectedBox(){return state.boxes.find(b=>b.id===state.selected)}
function renderToolbar(){const tb=document.createElement('div');tb.className='toolbar';
 const cal=document.createElement('button');cal.textContent='Calibrate scale';cal.className=state.mode==='cal'?'primary':'';cal.addEventListener('click',()=>{state.mode='cal';state.draft=[];state.drag=null;render()});tb.appendChild(cal);
 const draw=document.createElement('button');draw.textContent='Draw floor area';draw.className=state.mode==='draw'?'primary':'';draw.addEventListener('click',startDraw);tb.appendChild(draw);
 const rect=document.createElement('button');rect.textContent='Quick rectangle';rect.addEventListener('click',addRectangle);tb.appendChild(rect);
 if(state.mode==='draw'){const finish=document.createElement('button');finish.textContent='Finish area';finish.className='primary';finish.disabled=state.draft.length<3;finish.addEventListener('click',finishDraw);tb.appendChild(finish);const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.addEventListener('click',cancelMode);tb.appendChild(cancel)}
 const clear=document.createElement('button');clear.textContent='Clear floor areas';clear.className='danger';clear.addEventListener('click',()=>{if(confirm('Clear all floor areas on this page?')){state.boxes=[];state.selected=null;state.draft=[];value();render()}});tb.appendChild(clear);root.appendChild(tb)}
function render(){root.innerHTML='';renderToolbar();const note=document.createElement('div');note.className='note';
 if(state.mode==='cal')note.textContent='Drag a line across a known dimension, then enter its real length.';
 else if(state.mode==='draw')note.textContent='Click each corner of the floor area, then press Finish area. You can move every corner afterwards and add extra points on any edge.';
 else note.textContent='Select an area to edit it. Drag green corner points individually, click a small midpoint handle to add another point, or drag inside the polygon to move the whole area.';root.appendChild(note);
 if(!state.image)return;
 const stage=document.createElement('div');stage.className='stage';const img=document.createElement('img');img.id='bg';img.src=state.image;img.addEventListener('load',()=>{state.natW=img.naturalWidth;state.natH=img.naturalHeight;renderOverlays(stage);resizeFrame()});stage.appendChild(img);root.appendChild(stage);if(img.complete&&img.naturalWidth){state.natW=img.naturalWidth;state.natH=img.naturalHeight;renderOverlays(stage)}renderEditor();resizeFrame()}
function renderOverlays(stage){stage.querySelectorAll('.overlay,.area-chip,.cal').forEach(el=>el.remove());const svg=svgEl('svg',{class:'overlay',viewBox:'0 0 100 100',preserveAspectRatio:'none'});stage.appendChild(svg);
 state.boxes.forEach(b=>{const poly=svgEl('polygon',{points:pointsAttr(b.points),class:'area-poly'+(state.selected===b.id?' selected':'')});poly.dataset.id=b.id;poly.addEventListener('pointerdown',ev=>{if(state.mode){return}ev.preventDefault();ev.stopPropagation();state.selected=b.id;const q=pos(ev);state.drag={kind:'move',id:b.id,start:q,points:b.points.map(point)};svg.setPointerCapture(ev.pointerId);renderEditor()});svg.appendChild(poly);
  if(state.selected===b.id){b.points.forEach((p,idx)=>{const v=svgEl('circle',{cx:p.x,cy:p.y,r:0.9,class:'vertex'+(idx===0?' first':'')});v.dataset.vertex=String(idx);v.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();state.drag={kind:'vertex',id:b.id,index:idx};svg.setPointerCapture(ev.pointerId)});svg.appendChild(v);const q=b.points[(idx+1)%b.points.length],mid={x:(p.x+q.x)/2,y:(p.y+q.y)/2};const m=svgEl('circle',{cx:mid.x,cy:mid.y,r:0.55,class:'midpoint'});m.dataset.midpoint=String(idx);m.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();const insertAt=idx+1;b.points.splice(insertAt,0,point(mid));value();renderOverlays(stage);renderEditor()});svg.appendChild(m)})}
  const c=centroid(b.points),chipEl=document.createElement('div');chipEl.className='area-chip';chipEl.style.left=c.x+'%';chipEl.style.top=c.y+'%';chipEl.dataset.id=b.id;chipEl.textContent=chip(b);stage.appendChild(chipEl)});
 if(state.mode==='draw'&&state.draft.length){const draft=svgEl('polyline',{points:pointsAttr(state.draft),class:'area-poly draft',fill:'none'});svg.appendChild(draft);state.draft.forEach((p,idx)=>{const v=svgEl('circle',{cx:p.x,cy:p.y,r:0.9,class:'vertex'+(idx===0?' first':'')});if(idx===0&&state.draft.length>=3){v.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();finishDraw()})}svg.appendChild(v)})}
 svg.addEventListener('pointerdown',ev=>{if(ev.target!==svg)return;const q=pos(ev);if(state.mode==='cal'){ev.preventDefault();state.drag={kind:'cal',x1:q.x,y1:q.y,x2:q.x,y2:q.y};svg.setPointerCapture(ev.pointerId)}else if(state.mode==='draw'){ev.preventDefault();state.draft.push(point(q));renderOverlays(stage);renderToolbarState()}else{state.selected=null;renderOverlays(stage);renderEditor()}});
 svg.addEventListener('pointermove',ev=>{if(!state.drag)return;const q=pos(ev);if(state.drag.kind==='cal'){state.drag.x2=q.x;state.drag.y2=q.y;renderCalibrationLive(stage,state.drag);return}const b=state.boxes.find(x=>x.id===state.drag.id);if(!b)return;if(state.drag.kind==='vertex'){b.points[state.drag.index]=point(q)}else if(state.drag.kind==='move'){const dx=q.x-state.drag.start.x,dy=q.y-state.drag.start.y;b.points=state.drag.points.map(p=>({x:clamp(p.x+dx,0,100),y:clamp(p.y+dy,0,100)}))}refreshGeometry(stage,b);renderEditor()});
 svg.addEventListener('pointerup',ev=>{if(!state.drag)return;if(state.drag.kind==='cal'){const d=state.drag,dist=Math.hypot(d.x2-d.x1,d.y2-d.y1);state.drag=null;if(dist>1)setCalibration(d.x1,d.y1,d.x2,d.y2);else render()}else{state.drag=null;value();renderOverlays(stage);renderEditor()}});
 renderCalibration(stage)}
function refreshGeometry(stage,b){
 const svg=stage.querySelector('.overlay');if(!svg)return;
 const poly=svg.querySelector('[data-id="'+b.id+'"]');if(poly)poly.setAttribute('points',pointsAttr(b.points));
 if(state.selected===b.id){
  const vertices=svg.querySelectorAll('.vertex[data-vertex]');vertices.forEach((v,i)=>{if(b.points[i]){v.setAttribute('cx',b.points[i].x);v.setAttribute('cy',b.points[i].y)}});
  const mids=svg.querySelectorAll('.midpoint[data-midpoint]');mids.forEach((m,i)=>{const a=b.points[i],q=b.points[(i+1)%b.points.length];if(a&&q){m.setAttribute('cx',(a.x+q.x)/2);m.setAttribute('cy',(a.y+q.y)/2)}});
 }
 const chipEl=stage.querySelector('.area-chip[data-id="'+b.id+'"]');if(chipEl){const c=centroid(b.points);chipEl.style.left=c.x+'%';chipEl.style.top=c.y+'%';chipEl.textContent=chip(b)}
}
function renderToolbarState(){const buttons=root.querySelectorAll('.toolbar button');buttons.forEach(btn=>{if(btn.textContent==='Finish area')btn.disabled=state.draft.length<3})}
function renderCalibration(stage){if(!state.calibration)return;const c=state.calibration;drawCalLine(stage,n(c.x1,0),n(c.y1,0),n(c.x2,0),n(c.y2,0),'cal')}
function renderCalibrationLive(stage,d){stage.querySelectorAll('.cal.live').forEach(el=>el.remove());drawCalLine(stage,d.x1,d.y1,d.x2,d.y2,'cal live')}
function drawCalLine(stage,x1,y1,x2,y2,cls){const line=document.createElement('div');line.className=cls;const r=stage.getBoundingClientRect(),dx=(x2-x1)/100*r.width,dy=(y2-y1)/100*r.height;line.style.left=x1+'%';line.style.top=y1+'%';line.style.width=Math.hypot(dx,dy)+'px';line.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';stage.appendChild(line)}
function renderEditor(){let ed=document.getElementById('editor');if(ed)ed.remove();const b=selectedBox();if(!b)return;ed=document.createElement('div');ed.id='editor';ed.className='editor';ed.innerHTML='<div class="grid"><div class="full"><label>Area label / level</label><input id="lbl"></div><div><label>Manual m² override (optional)</label><input id="manual" type="number" min="0" step="0.01"></div><div><label>Measured area</label><div class="metric" id="mval"></div></div><div><label>Editable points</label><div class="metric" id="pcount"></div></div><div><label>Scale</label><div class="metric" id="scaleval"></div></div></div><div class="tip">Drag any green corner to reshape the area. Click a small midpoint circle on an edge to insert a new point. Remove last point only if you want to simplify the outline.</div><div class="editor-actions"><button id="removeLast">Remove last point</button><button id="deleteArea" class="danger">Delete selected area</button></div>';root.appendChild(ed);const lbl=ed.querySelector('#lbl');lbl.value=b.label||'';lbl.addEventListener('change',()=>{b.label=lbl.value;value();render()});const man=ed.querySelector('#manual');man.value=n(b.manual_m2,0)||'';man.addEventListener('change',()=>{b.manual_m2=n(man.value,0);value();render()});ed.querySelector('#mval').textContent=area(b)>0?p2(area(b))+' m²':'Calibrate scale first';ed.querySelector('#pcount').textContent=b.points.length+' points';ed.querySelector('#scaleval').textContent=pxPerM()>0?p2(pxPerM())+' px/m':'Not calibrated';const rm=ed.querySelector('#removeLast');rm.disabled=b.points.length<=3;rm.addEventListener('click',()=>{if(b.points.length>3){b.points.pop();value();render()}});ed.querySelector('#deleteArea').addEventListener('click',()=>{state.boxes=state.boxes.filter(x=>x.id!==b.id);state.selected=null;value();render()});resizeFrame()}
function resizeFrame(){post('streamlit:setFrameHeight',{height:Math.max(860,document.body.scrollHeight+20)})}
window.addEventListener('message',ev=>{const d=ev.data;if(!d||d.type!=='streamlit:render')return;const a=d.args||d,rev=n(a.revision,0);if(state.image!==String(a.image||'')||state.revision!==rev){state.image=String(a.image||'');state.revision=rev;state.boxes=Array.isArray(a.boxes)?a.boxes.map((x,i)=>normalizeBox(Object.assign({},x),i)):[];state.calibration=a.calibration||null;state.selected=state.boxes.length?state.boxes[0].id:null;state.mode='';state.drag=null;state.draft=[]}render()});
window.addEventListener('load',()=>post('streamlit:componentReady',{apiVersion:1}));
})();
</script>
</body>
</html>
